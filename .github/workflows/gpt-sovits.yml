name: GPT-SoVITS · CPU 跑通

# 触发方式：手动 Run workflow，可在表单里改模式、文本、训练轮数。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "跑什么"
        required: true
        default: full
        type: choice
        options:
          - full          # 微调 + 合成（端到端验证）
          - train         # 只微调，产出权重
          - infer         # 只用预训练权重合成（不做微调）
      version:
        description: "模型版本"
        required: true
        default: v2
        type: choice
        options: [v1, v2]
      text:
        description: "要合成的目标文本"
        required: true
        default: "在 GitHub Actions 上用纯 CPU 跑通了语音克隆。这台机器没有显卡，从装依赖到合成出声音，全部是自动完成的。"
      gpt_epochs:
        description: "GPT 微调轮数（小数据集建议 10-20）"
        required: false
        default: "12"
      s2_epochs:
        description: "SoVITS 微调轮数"
        required: false
        default: "8"
      hf_mirror:
        description: "用 hf-mirror.com 下载权重（国内网络选 true）"
        required: false
        default: false
        type: boolean

concurrency:
  group: gpt-sovits-${{ github.ref }}-${{ inputs.mode }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    name: ${{ inputs.mode }} · ${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      EXP_NAME: demo_voice
      VERSION: ${{ inputs.version }}
      GPT_EPOCHS: ${{ inputs.gpt_epochs }}
      S2_EPOCHS: ${{ inputs.s2_epochs }}
      HF_MIRROR: ${{ inputs.hf_mirror && '1' || '0' }}
      TARGET_TEXT: ${{ inputs.text }}
      # 上游仓库固定到一个已知能跑的 commit，避免哪天 main 改动把流水线弄红
      GSV_REF: main
      DEBIAN_FRONTEND: noninteractive

    steps:
      # ---------------------------------------------------------------- 前置
      - name: Checkout
        uses: actions/checkout@v4

      - name: 看清 runner 的底子
        run: |
          echo "== 系统 =="; cat /etc/os-release | head -3
          echo "== CPU =="; nproc; lscpu | grep -E "Model name|Thread|Core" | head -3
          echo "== 内存 =="; free -h | head -2
          echo "== 磁盘（跑之前）=="; df -h /
          echo "== Python =="; ls /usr/bin/python3* /usr/share/miniconda/bin/python* 2>/dev/null

      # runner 镜像里塞了一堆用不到的东西（.NET / Swift / CodeQL / Android SDK / 两个版本的 ghc）。
      # 微调要下 1.6GB 权重 + 编译 pyopenjtalk，先把磁盘腾出来更稳。
      - name: 腾磁盘
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                       /usr/local/.ghcup /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          sudo apt-get clean
          echo "== 磁盘（清理后）=="; df -h /

      - name: 安装 python3.10
        run: |
          # GPT-SoVITS 明确支持 3.10；runner 默认是 3.12，直接用 deadsnakes 装
          sudo apt-get install -y -qq --no-install-recommends software-properties-common
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            python3.10 python3.10-venv python3.10-dev
          python3.10 -V

      # ---------------------------------------------------------------- 依赖
      - name: 装 Python 依赖
        run: REPO_DIR="$PWD" PY=python3.10 bash scripts/bootstrap.sh

      - name: 克隆 GPT-SoVITS
        run: |
          git clone --depth 1 --branch "$GSV_REF" \
            https://github.com/RVC-Boss/GPT-SoVITS.git GPT-SoVITS
          echo "== GPT-SoVITS commit =="
          git -C GPT-SoVITS rev-parse HEAD
          ls GPT-SoVITS

      - name: 下载预训练权重
        run: REPO_DIR="$PWD" NEED_D="${{ inputs.mode == 'infer' && '0' || '1' }}" bash scripts/fetch_models.sh

      - name: 磁盘占用（权重下载后）
        run: df -h / ; du -sh GPT-SoVITS GPT-SoVITS/GPT_SoVITS/pretrained_models

      # ---------------------------------------------------------------- 微调
      - name: 生成训练清单
        if: inputs.mode != 'infer'
        run: |
          python3.10 scripts/make_list.py

      - name: 微调（s1 + s2）
        if: inputs.mode != 'infer'
        run: |
          REPO_DIR="$PWD" VENV_PY="$PWD/.venv/bin/python" bash scripts/train.sh

      - name: 收集微调产物
        if: inputs.mode != 'infer'
        run: |
          mkdir -p artifacts/weights
          cp -v GPT_weights_v2/*.ckpt  artifacts/weights/ 2>/dev/null || true
          cp -v SoVITS_weights_v2/*.pth artifacts/weights/ 2>/dev/null || true
          ls -lh artifacts/weights || true

      # ---------------------------------------------------------------- 合成
      - name: 合成语音
        run: |
          mkdir -p data/out
          .venv/bin/python scripts/tts_synthesize.py \
            --text "$TARGET_TEXT" \
            --lang zh \
            --ref-audio data/raw/ref.wav \
            --out data/out/tts_out.wav

      - name: 校验成片（不能只看 job 是绿的）
        run: |
          set -e
          ls -lh data/out/
          echo "== ffprobe =="
          ffprobe -v error \
            -show_entries stream=codec_name,sample_rate,channels \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 data/out/tts_out.wav
          DUR=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 data/out/tts_out.wav)
          SIZE=$(stat -c%s data/out/tts_out.wav)
          python3 - "$DUR" "$SIZE" <<'EOF'
          import sys
          dur, size = float(sys.argv[1]), int(sys.argv[2])
          assert dur > 1.0, f"时长太短 {dur}s"
          assert size > 200_000, f"文件太小 {size} bytes"
          print(f"OK: {dur:.2f}s / {size} bytes")
          EOF

      # ---------------------------------------------------------------- 交付
      - name: 上传合成结果
        uses: actions/upload-artifact@v4
        with:
          name: tts-output-${{ inputs.mode }}-${{ inputs.version }}
          path: |
            data/out/
          if-no-files-found: error
          retention-days: 14

      - name: 上传微调权重
        if: inputs.mode != 'infer' && hashFiles('artifacts/weights/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: finetuned-weights-${{ inputs.version }}
          path: artifacts/weights/
          if-no-files-found: error
          retention-days: 14

      - name: 上传训练中间产物（排查用）
        if: failure() || inputs.mode != 'infer'
        uses: actions/upload-artifact@v4
        with:
          name: train-logs
          path: |
            logs/**/*.txt
            logs/**/*.tsv
            logs/**/*.log
            logs/**/config.json
            logs/**/tmp_s*.yaml
            logs/**/tmp_s*.json
          if-no-files-found: ignore
          retention-days: 7

      - name: 最终磁盘与耗时
        if: always()
        run: |
          echo "== 磁盘 =="; df -h /
          echo "== 产物 =="; du -sh data/out artifacts 2>/dev/null || true
